name: benchmarks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  schema-and-crop-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Rust toolchain
        run: |
          rustup toolchain install 1.85.1 --profile minimal
          rustup default 1.85.1

      - name: Install package with bench extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[bench]"

      - name: Install GnuCOBOL 3 (COBOL backend rows)
        run: |
          sudo apt-get update
          sudo apt-get install -y gnucobol3

      - name: Compile the COBOL backend
        run: make -C cobol lib

      - name: Schema unit tests
        run: pytest benchmarks/tests/ -v

      - name: Crop profile — cold + 2 warm (variance evidence)
        run: |
          python -m benchmarks --profile crop --warm-runs 2 \
            --outdir benchmarks/results/ci-crop
          cat benchmarks/results/ci-crop/SUMMARY.md >> "$GITHUB_STEP_SUMMARY"

  cobol-crop500-feasibility:
    runs-on: ubuntu-latest
    # Feasibility row only (spec locked decision 10 — no performance
    # gate): GnuCOBOL 3.2's decimal arithmetic makes the anisodiff stage
    # the dominant cost (~12 s/iter at 500x500), so the reduced crop500
    # profile with one warm run is the largest CI-feasible workload.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Rust toolchain
        run: |
          rustup toolchain install 1.85.1 --profile minimal
          rustup default 1.85.1

      - name: Install package with bench extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[bench]"

      - name: Install GnuCOBOL 3 (COBOL backend rows)
        run: |
          sudo apt-get update
          sudo apt-get install -y gnucobol3

      - name: Compile the COBOL backend
        run: make -C cobol lib

      - name: COBOL crop500 profile — cold + 1 warm (feasibility row)
        run: |
          PYGEOFLOOD_COBOL=1 python -m benchmarks --profile crop500 \
            --warm-runs 1 --outdir benchmarks/results/ci-cobol
          cat benchmarks/results/ci-cobol/SUMMARY.md >> "$GITHUB_STEP_SUMMARY"
