name: native

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Rust toolchain
        run: rustup toolchain install 1.85.1 --profile minimal --component rustfmt --component clippy
      - name: Format, lint, and unit tests
        env:
          PYO3_PYTHON: python
        run: |
          cargo +1.85.1 fmt --manifest-path rust/Cargo.toml --check
          cargo +1.85.1 clippy --manifest-path rust/Cargo.toml --locked --all-targets -- -D warnings
          cargo +1.85.1 test --manifest-path rust/Cargo.toml --locked

  packaging:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install Rust toolchain
        run: |
          rustup toolchain install 1.85.1 --profile minimal
          rustup default 1.85.1
      - name: Editable install and numerical parity
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest 'maturin>=1.8,<2'
          pytest tests/test_anisodiff.py -q
      - name: Build abi3 wheel and source distribution
        run: |
          maturin build --release --locked --out dist
          maturin sdist --out dist
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          wheels = list(Path('dist').glob('*.whl'))
          assert len(wheels) == 1 and '-cp310-abi3-' in wheels[0].name
          with ZipFile(wheels[0]) as wheel:
              assert 'pygeoflood/data/COMID_Roughness.csv' in wheel.namelist()
              assert any(name.startswith('pygeoflood/_rust') and name.endswith('.so')
                         for name in wheel.namelist())
          PY
      - name: Test installed wheel outside checkout
        run: |
          pip uninstall -y pygeoflood
          pip install --no-deps dist/*.whl
          mkdir -p "$RUNNER_TEMP/native-tests"
          cp tests/test_anisodiff.py tests/reference_anisodiff.py "$RUNNER_TEMP/native-tests/"
          cd "$RUNNER_TEMP/native-tests"
          pytest -q
      - name: Rebuild and test from sdist
        run: |
          pip uninstall -y pygeoflood
          pip install --no-deps dist/*.tar.gz
          cd "$RUNNER_TEMP/native-tests"
          pytest -q
