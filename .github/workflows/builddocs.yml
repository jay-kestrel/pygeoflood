name: documentation_sphinx

on: [workflow_dispatch]

permissions:
  contents: write

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      # Full-commit-SHA pins: tags are mutable refs, so a compromised action
      # repository could repoint a tag at attacker-controlled code.
      - uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3
      - uses: actions/setup-python@3542bca2639a428e1796aaa6a2ffef0c0f575566 # v3
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc libgdal-dev gdal-bin
          pip install sphinx sphinx_rtd_theme myst_parser furo nbsphinx scikit-fmm ipython
          pip install -r requirements.txt
      - name: Sphinx build
        run: |
          sphinx-build -b html -E doc _build/html
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@373f7f263a76c20808c831209c920827a82a2847 # v3
#        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        with:
          publish_branch: gh-pages
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: _build/html
          force_orphan: true

