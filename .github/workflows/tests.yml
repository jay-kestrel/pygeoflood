name: tests

# Run the two test files no existing workflow executed (PG-1 finding F12):
# the functionality smoke suite and the process_cells parallel/serial
# determinism regression — the latter being the only guard for the 22dfed9
# race fix. The determinism job deliberately does NOT pin
# NUMBA_NUM_THREADS: the test reads the ambient thread count, and pinning
# it to 1 would reduce the parallelism check to a serial no-op.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  process-cells-determinism:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Org Actions policy only permits actions from repositories owned by
      # jay-kestrel, so actions/checkout is inlined as a run step (fetches the
      # same commits actions/checkout would provide).
      - name: Checkout
        run: |
          git init "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" remote add origin "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git"
          git -C "$GITHUB_WORKSPACE" fetch --depth=1 origin "${GITHUB_REF}"
          git -C "$GITHUB_WORKSPACE" checkout --detach FETCH_HEAD

      # actions/setup-python is blocked by the same policy; uv (from PyPI,
      # bootstrapped in a throwaway venv) installs the pinned interpreter into
      # a pip-seeded venv that the pip/pytest steps below pick up via PATH.
      - name: Install Python 3.12 via uv
        run: |
          python3 -m venv /tmp/uv-bootstrap
          /tmp/uv-bootstrap/bin/pip install --quiet "uv==0.13.6"
          echo "/tmp/uv-bootstrap/bin" >> "$GITHUB_PATH"
          uv python install 3.12
          uv venv --seed --python 3.12
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Install Rust toolchain
        run: |
          rustup toolchain install 1.85.1 --profile minimal
          rustup default 1.85.1

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest

      - name: Parallel/serial determinism at ambient thread count
        run: pytest tests/test_process_cells_determinism.py -v

  functionality-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      WBT_PATH: /opt/wbt/WhiteboxTools_linux_amd64/WBT
      NUMBA_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      # Org Actions policy: inline checkout and uv-managed Python instead of
      # the blocked third-party actions.
      - name: Checkout
        run: |
          git init "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" remote add origin "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git"
          git -C "$GITHUB_WORKSPACE" fetch --depth=1 origin "${GITHUB_REF}"
          git -C "$GITHUB_WORKSPACE" checkout --detach FETCH_HEAD

      - name: Install Python 3.12 via uv
        run: |
          python3 -m venv /tmp/uv-bootstrap
          /tmp/uv-bootstrap/bin/pip install --quiet "uv==0.13.6"
          echo "/tmp/uv-bootstrap/bin" >> "$GITHUB_PATH"
          uv python install 3.12
          uv venv --seed --python 3.12
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      # actions/cache is blocked by the same policy; the pinned WhiteboxTools
      # zip is simply downloaded on every run (the old cache-miss path).
      - name: Download WhiteboxTools v2.4.0
        run: |
          mkdir -p /opt/wbt
          curl -sL --retry 3 \
            https://www.whiteboxgeo.com/WBT_Linux/WhiteboxTools_linux_amd64.zip \
            -o /tmp/wbt.zip
          unzip -q /tmp/wbt.zip -d /opt/wbt

      - name: Verify pinned WhiteboxTools version
        run: |
          "$WBT_PATH/whitebox_tools" --version | grep "v2.4.0"

      - name: Install Rust toolchain
        run: |
          rustup toolchain install 1.85.1 --profile minimal
          rustup default 1.85.1

      - name: Install package with pinned environment
        run: |
          python -m pip install --upgrade pip
          pip install -c tests/golden/requirements-pins.txt -e . pytest

      # fill_spill_merge lazily imports the mdp0023/richdem fork
      # (pygeoflood.py:2378-2386); without it 3 of the 97 tests fail with
      # the guard's own ImportError. setuptools<81 provides pkg_resources,
      # which the fork's __init__ still imports and setuptools 81+ dropped.
      - name: Install richdem fork for fill_spill_merge tests
        run: |
          pip install "setuptools<81"
          pip install "richdem @ git+https://github.com/mdp0023/richdem.git@717abd7e1db0632f047ec4d57224a557d6212012#subdirectory=wrappers/pyrichdem"

      - name: Functionality smoke suite
        run: pytest tests/test_functionality.py -v
