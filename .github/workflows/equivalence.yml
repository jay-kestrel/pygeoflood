name: equivalence

# First test CI this repo has had: runs the golden-value equivalence suite
# (spec D2) on the deterministic 2000x2000 crop, with a pinned, cached
# WhiteboxTools v2.4.0 binary.
#
# The suite regenerates the golden corpus twice (byte-identical manifests),
# checks both against the pinned manifest, applies the tolerance-table gates,
# and runs the discrimination check.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  equivalence:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      WBT_PATH: /opt/wbt/WhiteboxTools_linux_amd64/WBT
      NUMBA_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache WhiteboxTools v2.4.0
        id: wbt-cache
        uses: actions/cache@v4
        with:
          path: /opt/wbt
          key: wbt-v2.4.0-linux-x86_64

      - name: Download WhiteboxTools v2.4.0
        if: steps.wbt-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p /opt/wbt
          curl -sL --retry 3 \
            https://www.whiteboxgeo.com/WBT_Linux/WhiteboxTools_linux_amd64.zip \
            -o /tmp/wbt.zip
          unzip -q /tmp/wbt.zip -d /opt/wbt

      - name: Verify pinned WhiteboxTools version
        run: |
          "$WBT_PATH/whitebox_tools" --version | grep "v2.4.0"

      - name: Install pygeoflood with pinned environment
        run: |
          python -m pip install --upgrade pip
          pip install -c tests/golden/requirements-pins.txt -e . pytest

      - name: Run golden equivalence suite
        run: |
          pytest tests/test_golden_equivalence.py -v
