name: equivalence

# First test CI this repo has had: runs the golden-value equivalence suite
# (spec D2) on the deterministic 2000x2000 crop, with a pinned
# WhiteboxTools v2.4.0 binary.
#
# The suite regenerates the golden corpus twice (byte-identical manifests),
# checks both against the pinned manifest, applies the tolerance-table gates,
# and runs the discrimination check.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Actions-free workflow: the repository policy accepts Actions components
# from jay-kestrel-owned repositories only, so checkout runs inline with
# the workflow token and the Python environment comes from the runner
# interpreter (ubuntu-latest ships 3.12). WhiteboxTools is downloaded each
# run instead of cached (same pinned archive, small download).
jobs:
  equivalence:
    runs-on: ubuntu-latest
    # two pinned full-size generations (reference determinism pair) plus
    # a paired Python/COBOL reduced-window generation (the COBOL row;
    # see cobol_run): budgeted above the two-run baseline
    timeout-minutes: 45
    env:
      WBT_PATH: /opt/wbt/WhiteboxTools_linux_amd64/WBT
      NUMBA_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      VIRTUAL_ENV: ${{ github.workspace }}/.venv
    steps:
      - name: Check out
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config --global init.defaultBranch main
          git init -q .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          git fetch -q --depth=1 origin "${{ github.ref }}"
          git checkout -q FETCH_HEAD

      - name: Create Python environment
        run: |
          python3 --version
          python3 -m venv "$VIRTUAL_ENV"
          echo "$VIRTUAL_ENV/bin" >> "$GITHUB_PATH"

      - name: Download WhiteboxTools v2.4.0
        run: |
          mkdir -p /opt/wbt
          curl -sL --retry 3 \
            https://www.whiteboxgeo.com/WBT_Linux/WhiteboxTools_linux_amd64.zip \
            -o /tmp/wbt.zip
          unzip -q -o /tmp/wbt.zip -d /opt/wbt

      - name: Verify pinned WhiteboxTools version
        run: |
          "$WBT_PATH/whitebox_tools" --version | grep "v2.4.0"

      - name: Install Rust toolchain
        run: |
          rustup toolchain install 1.85.1 --profile minimal
          rustup default 1.85.1

      - name: Install pygeoflood with pinned environment
        run: |
          pip install --upgrade pip
          pip install -c tests/golden/requirements-pins.txt -e . pytest

      - name: Install GnuCOBOL 3 (COBOL-backend row)
        run: |
          sudo apt-get update
          sudo apt-get install -y gnucobol3

      - name: Compile the COBOL backend
        run: make -C cobol lib

      - name: Run golden equivalence suite
        run: |
          pytest tests/test_golden_equivalence.py -v
